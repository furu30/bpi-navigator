# Netlify 設定（KATA Navi アプリA：Next.js 静的書き出し）
# このファイルは Next プロジェクトルート（kata-navi/）に置く。
# Netlify サイトの base directory を kata-navi/ に設定して使う想定
# （リポジトリ直下から使う場合は base = "kata-navi" を指定）。

[build]
  command = "next build"   # next.config の output:"export" により out/ を生成
  publish = "out"

[build.environment]
  NODE_VERSION = "20"      # Next.js 16 の動作要件を満たすNodeバージョン

# ===== セキュリティヘッダ（静的配信のためホスティング側で付与）=====
# AIアシストはブラウザから各プロバイダへ直接アクセスする（BYOキー）ため、
# connect-src に各APIエンドポイントのみ許可する。サーバー秘密情報は持たない。
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "off"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
